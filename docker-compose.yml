# Contrato consumido por .github/workflows/deploy.yml na VPS:
#   git pull --ff-only  &&  docker compose up -d --build  (a partir de VPS_PATH)
# O arquivo real compose.env só existe na VPS (fora do git) — veja compose.env.example.
services:
  flex-diet:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - compose.env
    volumes:
      - "./data:/app/data"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
