name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice::Secrets VPS_HOST / VPS_USER / VPS_SSH_KEY nao configurados — deploy pulado."
            exit 0
          fi
          install -m 600 /dev/null /tmp/deploy_key
          trap 'rm -f /tmp/deploy_key' EXIT
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          ssh -i /tmp/deploy_key -p "${VPS_PORT:-22}" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" bash -s -- "${VPS_PATH:-/opt/flex-diet}" <<'REMOTE'
            set -euo pipefail
            cd "$1"
            if [ ! -f docker-compose.yml ] && [ ! -f compose.yaml ]; then
              echo "Nada para deployar ainda (sem compose file em $1) — pulando."
              exit 0
            fi
            git pull --ff-only
            docker compose up -d --build
          REMOTE
